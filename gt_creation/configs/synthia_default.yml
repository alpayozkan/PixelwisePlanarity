# SYNTHIA-AL Plane Extraction Configuration
# ==========================================

# Data paths (override with CLI args)
# SYNTHIA scenes are in: test/test5_{N}segs_weather_{W}_spawn_{S}_.../DD-MM-YYYY_HH-MM-SS/
# Point --scene_dir to the timestamp directory or the parent test5_... directory
output_root: /cluster/scratch/aoezkan/planeseg/synthia/synthia_planes

# RANSAC parameters
ransac_iters: 500
dist_thresh: 0.01       # meters (depth-adaptive)
normal_cos: 0.985       # ~10 degrees
min_inliers: 50         # minimum pixels per plane
max_planes: 50          # max planes per semantic class per frame

# Merge parameters
merge_normal: 0.985     # cosine threshold for normal similarity
merge_rel_dist: 0.02    # relative distance threshold
