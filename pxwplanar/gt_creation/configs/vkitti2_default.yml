# VKITTI2 Plane Extraction Configuration
# ========================================

# Data root (if rgb/depth/semseg are all under one directory)
data_root: /path/to/vkitti2/raw

# Or specify separate roots (overrides data_root):
# rgb_root: /path/to/vkitti2/vkitti_2.0.3_rgb
# depth_root: /path/to/vkitti2/vkitti_2.0.3_depth
# semseg_root: /path/to/vkitti2/vkitti_2.0.3_classSegmentation

output_root: /path/to/output/vkitti2_planes

# RANSAC parameters
ransac_iters: 500
dist_thresh: 0.01       # meters (depth-adaptive)
normal_cos: 0.985       # ~10 degrees
min_inliers: 50         # minimum pixels per plane
max_planes: 50          # max planes per semantic class per frame

# Merge parameters
merge_normal: 0.985     # cosine threshold for normal similarity
merge_rel_dist: 0.02    # relative distance threshold

# Camera (0=left, 1=right)
camera: 0

# Train/test split
train_scenes:
  - Scene01
  - Scene02
  - Scene06
test_scenes:
  - Scene18
  - Scene20
