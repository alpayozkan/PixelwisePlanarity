# PlaneRCNN GT v1 Configuration for ScanNet++
#
# Changes from planercnn_default.yml:
#   - Stricter RANSAC thresholds (tighter inlier distance, more iterations)
#   - Stricter coverage gate (60% → was 50%)
#   - Higher min vertex count (200 → was 100)
#   - Label mappings updated for ScanNet++ semantic classes
#     (original was copied from ScanNet which has different label names)

# --- Paths ---
mesh_root: "/cluster/scratch/aoezkan/planeseg/dataset_mesh/scannetpp_planercnn_v1"
output_root: "/cluster/scratch/aoezkan/planeseg/dataset/scannetpp_planercnn_v1"

# --- Plane Fitting (RANSAC) ---
num_planes_per_segment: 2
plane_area_threshold: 200         # stricter: 200 (was 100)
num_iterations: 300               # more iterations: 300 (was 200)
plane_diff_threshold: 0.01        # tighter inlier distance: 1cm (was 2cm)
fitting_error_threshold: 0.01     # matches plane_diff_threshold
coverage_gate: 0.6                # stricter: 60% (was 50%)
floor_error_scale: 3.0

# --- Merging / Orthogonality ---
orthogonal_threshold_deg: 60
parallel_threshold_deg: 30

# --- Rendering ---
target_width: 640
target_height: 480
frame_skip: 25

# --- Per-Label Plane Count Bounds ---
# Updated for ScanNet++ semantic_classes.txt labels.
# Format: label: [min_planes, max_planes]
# Labels not listed default to [0, 5].
