[project]
name = "pxwplanar"
version = "0.1.0"
description = "Pixel-wise planarity: planar surface detection and segmentation from single RGB images"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ahmetcan Yavuz" },
    { name = "Alpay Ozkan" },
    { name = "Rémi Pautrat", email = "pautratrmi@microsoft.com"},
    { name = "Shaohui Liu", email = "b1ueber2y@gmail.com" },
]
requires-python = ">=3.10"
# Version pins live in env/environment.yml (the supported way to install is
# env/create_env.sh); this list keeps a plain `pip install -e .` functional.
dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "opencv-python",
    "pillow",
    "matplotlib",
    "h5py",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "imageio",
    "open3d",
    "trimesh",
    "plyfile",
    "pandas",
    "pyyaml",
    "tqdm",
    "natsort",
    "joblib",
    "connected-components-3d",
    # required by the MoGe submodule (imported by every inference entry point)
    "huggingface_hub",
    # MoGe fork with the 4-head model; a checkout uses the MoGe/ submodule
    # instead (see pxwplanar/moge_backend.py)
    "moge @ git+https://github.com/Ahmetcanyvz/MoGe.git@planarity",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@3fab839f0be9931dac7c8488eb0e1600c236e183",
]

[project.optional-dependencies]
dev = ["ruff==0.15.20"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pxwplanar*"]

[tool.setuptools.package-data]
pxwplanar = [
    "gt_creation/configs/*.yml",
    "gt_creation/scripts/*.sh",
    "shared/datasets/*.csv",
    "evaluation/qualitative/*.txt",
]
