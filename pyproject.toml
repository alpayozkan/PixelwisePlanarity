[project]
name = "planamono"
version = "0.1.0"
description = "My editable pip-installable library"
authors = [
    { name="Your Name", email="you@email.com" }
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "open3d",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
