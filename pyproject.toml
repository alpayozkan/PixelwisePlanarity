[project]
name = "pxwplanar"
version = "0.1.0"
description = "Pixel-wise planarity: planar surface detection and segmentation from single RGB images"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "open3d",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pxwplanar*"]
